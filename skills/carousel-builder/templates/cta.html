<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
  :root{
    --light:#F8F8F8; --dark:#0E0E0E; --accent:#F55C00;
    --display:'Inter', sans-serif; --body:'Inter', sans-serif;
  }
  .cta-main{align-items:center;text-align:center;}
  .cta-main .lead{margin-left:auto;margin-right:auto;}
  .cta-main .cta-btn{align-self:center;}
</style>
</head>
<body>
  <div class="slide dark">
    <div class="chrome"><span class="accent"># SERIES LABEL</span><span class="muted">@yourhandle</span></div>
    <div class="hairline"></div>

    <div class="main cta-main">
      <div class="display h-cover">Comment <span class="accent">"KEYWORD"</span></div>
      <div class="lead">One line on exactly what they get and why it's worth the comment.</div>
      <div class="cta-btn">COMMENT <span class="kw">KEYWORD</span></div>
    </div>

    <div class="hairline"></div>
    <div class="chrome"><span>YOUR NAME</span><span class="accent">FOLLOW FOR MORE →</span></div>
  </div>
</body>
</html>
