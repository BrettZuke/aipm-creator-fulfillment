<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
  :root{
    --light:#F8F8F8; --dark:#0E0E0E; --accent:#F55C00;
    --display:'Inter', sans-serif; --body:'Inter', sans-serif;
  }
</style>
</head>
<body>
  <!-- Alternate .light / .dark between slides so no two in a row match. -->
  <div class="slide light">
    <div class="chrome"><span class="accent"># SERIES LABEL</span><span><span class="accent">02</span> / 08</span></div>
    <div class="hairline"></div>

    <div class="main">
      <div class="head"><span class="num">1.</span><span class="name">Point title</span></div>
      <div class="sub">One line that frames this point.</div>

      <div class="rows">
        <div class="row"><div class="rlabel">What it is</div><div class="rbody">Explain the idea in <b>one tight sentence</b>, with the key phrase bolded.</div></div>
        <div class="row"><div class="rlabel">Why it works</div><div class="rbody">The reason it matters to the reader, in their language.</div></div>
        <div class="row"><div class="rlabel">Do this</div><div class="rbody">The single concrete action they can take today.</div></div>
      </div>
    </div>

    <div class="hairline"></div>
    <div class="chrome"><span>YOUR NAME</span><span class="accent">SWIPE →</span></div>
  </div>
</body>
</html>
